name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the tests run the TypeScript sources, which needs Node.js 22.18+
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # the published CLI (dist/) supports Node.js 18+
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v5
      # built as it's published, then installed on the older Node.js
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm pack
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g ./desktopengine-sdk-*.tgz
      - name: Create, validate and pack a project of each type
        run: |
          cd "$RUNNER_TEMP"
          for type in wallpaper widget companion; do
            desktopengine create "$type" "$type"
            desktopengine validate "$type"
            desktopengine pack "$type"
          done

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
